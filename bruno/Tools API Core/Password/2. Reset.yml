http:
  method: POST
  url: "{{apiCoreUrl}}/auth/password/reset"
  auth:
    type: none
  body:
    type: json
    data: |-
      {
        "token": "jeton-recu-par-email",
        "password": "nouveau-mot-de-passe"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
