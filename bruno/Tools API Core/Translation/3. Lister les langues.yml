info:
  name: Lister les langues
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/translation/languages"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  US-2. Les langues que le moteur sait traduire, lues chez lui (le NAS n'en charge qu'une partie) :
  `[{ code, name, targets }]`, `targets` listant les langues cibles possibles depuis `code`.
  Mêmes droits que la traduction.
