info:
  name: Shutdown Server
  type: http
  seq: 10

http:
  method: POST
  url: "{{apiJavaUrl}}/palworld/server/shutdown"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "waittime": 60,
        "message": "Server shutting down"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
