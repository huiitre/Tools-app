spring.application.name=tools-api-qa

# ===============================
# Database (shared dev DB assumée)
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres_tools}:${DB_PORT:5432}/${DB_NAME:tools_qa}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8082}
server.servlet.context-path=/api/v3

# ===============================
# Logging (QA = verbeux contrôlé)
# ===============================
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.fr.huiitre.tools=DEBUG
spring.main.log-startup-info=false

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Internal services
# ===============================
tools.services.host=${TOOLS_SERVICES_HOST}

# ===============================
# JWT
# ===============================
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl=600
security.jwt.refresh-token-ttl=604800
security.jwt.issuer=tools-api
security.cookie.secure=true

# ===============================
# SPRINGDOC API
# ===============================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# Security CSP
# ===============================
security.csp.policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:

# ===============================
# SMTP
# ===============================
spring.mail.host=ssl0.ovh.net
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_USERNAME}
mail.to=${MAIL_TO}
report.dir=${REPORT_DIR:./tmp/reports}

# ===============================
# PATH
# ===============================
tools.assets.base-path=/data/tools_assets

# ===============================
# URLs
# ===============================
app.frontend.base-url=https://qa.tools.huiitre.fr
app.assets.base-url=https://assets.tools.huiitre.fr
palworld.api.base-url=http://wireguard-games:8212

# ===============================
# Google OAuth
# ===============================
google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
google.oauth.redirect-uri=https://qa.api.tools.huiitre.fr/api/v3/auth/callback/google

# ===============================
# Encryption
# ===============================
tools.security.encryption.master-key=${TOOLS_ENCRYPTION_KEY}

# ===============================
# HikariCP
# ===============================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000