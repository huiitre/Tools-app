info:
  name: Lister mes suivis
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/riot/valorant/watchlist?accountId=1"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Skins suivis sur ce compte. `accountId` est **obligatoire** ici.

  Rôle minimum : READ_ONLY.
