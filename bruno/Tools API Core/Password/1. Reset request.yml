info:
  name: 1. Reset request
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiUrl}}/auth/password/reset-request"
  auth:
    type: none
  body:
    type: json
    data: |-
      {
        "email": "{{authEmail}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
