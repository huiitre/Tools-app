info:
  name: Supprimer une équipe
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{apiUrl}}/temtem/teams/1"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Supprime l'équipe. `204` sans corps — c'est la seule écriture qui ne rend pas l'équipe.

  Les membres et leurs techniques partent en cascade : une seule requête suffit.

  `404 TEAM_NOT_FOUND` — équipe inexistante ou appartenant à un autre.
