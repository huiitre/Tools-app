info:
  name: 3. Set password
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{apiCoreUrl}}/users/password"
  auth:
    type: bearer
    token: "{{authToken}}"
  body:
    type: json
    data: |-
      {
        "password": "nouveau-mot-de-passe"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
