info:
  name: Mon historique
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/riot/valorant/store-history?accountId=1"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Rotations archivées, groupées par date, de la plus récente à la plus ancienne.

  Rôle minimum : READ_ONLY.
