info:
  name: Admin - Get all feedbacks
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}/feedbacks/admin"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 + liste des feedbacks, triés du plus récent au plus ancien. Rôle minimum : ADMIN.
