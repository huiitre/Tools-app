info:
  name: Execute game server action
  type: http
  seq: 5

http:
  method: POST
  url: "{{apiUrl}}/gameservers/palworld/actions/announce"
  auth:
    type: bearer
    token: "{{authToken}}"
  body:
    type: json
    data: |
      {
        "parameters": {
          "message": "Test depuis Bruno"
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "Déclenche une commande d'administration sur un serveur. Le code d'action et les paramètres (`parameters`) sont ceux que le jeu déclare. ils sont listés dans le champ actions de GET /gameservers/{slug}/details, déjà filtré sur les droits de l'appelant. Palworld accepte announce, save, kick, ban, unban, shutdown (son propre délai natif via le paramètre `waittime`, en secondes), stop ; Ark accepte announce, save, kick, ban ; Cobblemon (Minecraft) accepte announce (message système « [Serveur] » à tous les joueurs), kick et ban (playerId = UUID ou pseudo d'un joueur connecté, reason facultative), restart (stop RCON, relancé par la politique de redémarrage du conteneur), et save — pas un save vanilla : ça déclenche le mod SimpleBackups (commande RCON `simplebackups backup start`), qui crée une archive zip complète, pas juste un flush mémoire. Fire-and-forget côté mod (thread démarré puis oublié) : la réponse 204 confirme seulement que la commande a été acceptée, jamais que le backup a réellement terminé — une vraie erreur de syntaxe RCON serait remontée en 400 GAME_SERVER_ACTION_REJECTED, un succès ne renvoie rien. `delaySeconds` (optionnel, à côté de `parameters`, jamais dedans) diffère l'action au lieu de l'exécuter tout de suite ; seules les actions dont `supportsDelay: true` dans GET details l'acceptent (aujourd'hui : uniquement Cobblemon `restart`, ex. `{ \"parameters\": {}, \"delaySeconds\": 60 }`). L'API gère alors elle-même le compte à rebours (GameServerActionCountdownService, voir api/docs/GAME_SERVER_ACTION_COUNTDOWN.md) : elle annonce le délai via l'action `announce` du jeu si elle existe (jamais bloquant si absente ou en échec), à des paliers décroissants, puis exécute l'action réellement demandée à zéro. Un nouveau `delaySeconds` sur le même serveur pendant qu'un compte à rebours est déjà en cours annule l'ancien et repart du nouveau délai. Le rôle exigé dépend de l'action (MODERATOR pour announce/save/kick, ADMIN pour ban/unban/shutdown/stop/restart) et il est revérifié côté serveur. Réponse 204 sans corps, avec ou sans délai — le statut ne distingue pas \"exécuté\" de \"programmé\". 404 si le slug est inconnu, si le jeu n'accepte aucune commande, ou si le code d'action n'existe pas pour ce jeu ; 400 GAME_SERVER_ACTION_PARAMETERS_MISSING si un paramètre obligatoire manque ; 400 GAME_SERVER_ACTION_DELAY_INVALID si `delaySeconds` est négatif ; 400 GAME_SERVER_ACTION_DELAY_UNSUPPORTED si `delaySeconds` > 0 est fourni pour une action qui ne le permet pas ; 400 GAME_SERVER_PLAYER_NOT_CONNECTED si le joueur visé n'est pas connecté (Cobblemon) ; 400 GAME_SERVER_ACTION_REJECTED si le serveur refuse la commande (Cobblemon) ; 403 si le rôle est insuffisant ; 503 GAME_SERVER_UNREACHABLE au-delà de 15 secondes (action immédiate uniquement — une action différée n'a pas ce timeout, elle attend le délai demandé)."
