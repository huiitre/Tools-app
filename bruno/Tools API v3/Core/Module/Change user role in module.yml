info:
  name: Change user role in module
  type: http
  seq: 5

http:
  method: PUT
  url: "{{apiUrl}}/modules/{{moduleId}}/users/{{userId}}/role"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "roleId": 5
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
