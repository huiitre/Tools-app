info:
  name: 1. Recherche par nom
  type: http
  seq: 1

http:
  method: GET
  url: https://recherche-entreprises.api.gouv.fr/search?q=marsignac
  params:
    - name: q
      value: marsignac
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Le cas nominal du module Job Tracker : un nom d'entreprise gratté sur une annonce, on cherche
  l'entreprise réelle derrière.

  La recherche est tolérante — `q=octo technology` fonctionne aussi bien que `q=worksoft`. Elle
  porte sur la dénomination, l'adresse et les dirigeants à la fois.

  À regarder dans la réponse : `siren`, `nom_raison_sociale`, `siege.libelle_commune`,
  `etat_administratif`.

  ⚠️ Plusieurs résultats peuvent remonter pour un même nom. Le premier n'est pas forcément le bon :
  une annonce publiée par un cabinet de recrutement donnera le cabinet, pas l'employeur.
