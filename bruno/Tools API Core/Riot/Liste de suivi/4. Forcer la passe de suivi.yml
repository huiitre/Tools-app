info:
  name: Forcer la passe de suivi
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiUrl}}/riot/valorant/watchlist/admin/sync"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Déclenche à la main la passe quotidienne : pour **chaque** compte lié de **tous** les
  utilisateurs, archive la boutique du jour et notifie les skins suivis qui y sont.

  Elle appelle Riot une fois par compte : à ne pas enchaîner.

  Rôle minimum : ADMIN.
