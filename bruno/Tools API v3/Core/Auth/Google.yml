info:
  name: Google
  type: http
  seq: 7

http:
  method: POST
  url: "{{apiJavaUrl}}/auth/google"
  body:
    type: json
    data: |-
      {
        "idToken": "{{googleIdToken}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const json = res.getBody();
        bru.setGlobalEnvVar('authToken', json.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
