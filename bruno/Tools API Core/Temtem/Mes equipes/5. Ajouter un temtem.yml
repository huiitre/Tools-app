info:
  name: Ajouter un Temtem
  type: http
  seq: 5

http:
  method: POST
  url: "{{apiUrl}}/temtem/teams/1/members"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "temtemId": 7,
        "slot": 3
      }
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Place un Temtem dans l'équipe et rend `TemtemTeamView`.

  `slot` est facultatif. Absent, le Temtem rejoint la **première place libre** (comportement
  historique). Présent, il désigne une place exacte, entre 1 et 6, qui doit être libre.

  Le même Temtem peut occuper deux places — le jeu l'autorise, et l'interdire reviendrait à
  décider à la place du joueur.

  - `409 TEAM_FULL` — les six places sont prises.
  - `409 TEAM_SLOT_OCCUPIED` — le slot demandé est déjà pris.
  - `400 TEAM_SLOT_INVALID` — le slot demandé n'est pas entre 1 et 6.
  - `404 TEMTEM_NOT_FOUND` — `temtemId` ne désigne aucun Temtem.
  - `404 TEAM_NOT_FOUND` — équipe inexistante ou appartenant à un autre.
