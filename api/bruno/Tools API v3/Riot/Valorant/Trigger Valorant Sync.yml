info:
  name: Trigger Valorant Sync
  type: http
  seq: 11

http:
  method: POST
  url: "{{apiUrl}}/riot/valorant/watchlist/admin/sync"
  headers:
    - name: Authorization
      value: Bearer {{YOUR_JWT_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Déclenche manuellement la synchronisation de la watchlist Valorant via l'API Riot.
