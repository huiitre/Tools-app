  url: "{{apiJavaUrl}}todolist/todo/{{idtodo}}/update"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "columns": [
          { "name": "sqdqsdqsdqdqsd" },
          { "description": "Ne pas oublier les croissants" },
          { "priority": 2 },
          { "is_completed": true }
        ]
      }
