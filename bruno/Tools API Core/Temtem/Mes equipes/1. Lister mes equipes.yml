info:
  name: Lister mes équipes
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/temtem/teams"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Les équipes de l'appelant (`TemtemTeamView`), triées par nom, avec leurs membres et les
  techniques retenues pour chacun.

  Chaque membre porte le **même** `TemtemSummaryView` que la carte du catalogue : la vignette
  d'équipe et la grille lisent les mêmes champs, définis une seule fois.

  `techniques` liste ce que le joueur a choisi, pas ce que le Temtem sait faire — la liste
  complète des techniques apprises se lit sur sa fiche (`GET /temtem/creatures/{slug}`).
