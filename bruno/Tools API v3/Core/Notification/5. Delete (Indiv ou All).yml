info:
  name: 5. Delete (Indiv ou All)
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{apiUrl}}/api/v3/notifications?ids=1"
  params:
    - name: ids
      value: "1"
      type: query
      description: "IDs séparés par virgule. Si vide : vide TOUTE la liste."
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Supprime les notifications. Sans paramètre 'ids', vide toute la liste.
