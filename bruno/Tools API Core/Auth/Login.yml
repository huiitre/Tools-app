info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiCoreUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{authEmail}}",
        "password": "{{authPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const json = res.getBody();
        bru.setGlobalEnvVar('authToken', json.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
