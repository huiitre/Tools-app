info:
  name: Get game server details
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/gameservers/{{gameCode}}/details"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Volet stable du dashboard d'un serveur, chargé une fois à l'ouverture. Un JWT avec au moins le rôle READ_ONLY est requis. serverName, gameName et pictureUrl viennent de game_servers et sont toujours renseignés ; version, description, worldId et settings ne le sont que si le jeu sait les fournir (null pour Ark, renseignés pour Palworld). actions liste les commandes d'administration que ce serveur accepte, déjà filtrées sur les droits de l'appelant : chaque entrée décrit ses paramètres, le front construit son formulaire à partir de là. 404 GAME_SERVER_NOT_FOUND si le slug est inconnu ou masqué, 404 GAME_SERVER_DASHBOARD_UNSUPPORTED si aucun provider n'est enregistré pour le jeu.
