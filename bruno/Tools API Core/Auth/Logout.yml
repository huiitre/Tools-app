info:
  name: Logout
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiCoreUrl}}/auth/logout"
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: bru.setGlobalEnvVar('authToken', '');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
