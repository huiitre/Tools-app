info:
  name: Supprimer une release
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{apiUrl}}/admin/android-apps/{{androidAppId}}/releases/{{androidReleaseId}}"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  US-4. Supprime la ligne puis le fichier APK, `204`.

  - `404 ANDROID_APP_NOT_FOUND` / `ANDROID_APP_RELEASE_NOT_FOUND`.
  - `409 ANDROID_APP_RELEASE_RECOMMENDED` — c'est la version proposée aux TV : en recommander une
    autre d'abord.
