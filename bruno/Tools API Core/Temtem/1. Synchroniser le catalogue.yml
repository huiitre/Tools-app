info:
  name: Synchroniser le catalogue
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiUrl}}/internal/temtem/sync"
  headers:
    - name: X-Api-Key
      value: "{{apiKeyValue}}"
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Recharge tout le catalogue Temtem depuis les données de l'extracteur, lues en HTTP sur le CDN
  des assets (`tools_temtem/*.json`). Aucun corps de requête.

  Appelée par `update_temtem.sh` sur le NAS après un scraping — le cron tourne toutes les
  2 heures et ne scrape que si une mise à jour du jeu est détectée.

  Authentification : un utilisateur **TECH** (Bearer), ou une **clé d'API** portant `temtem:sync`
  dans `X-Api-Key` — la variable `apiKeyValue` est posée par « API Keys / 2. Créer une clé ». Le
  temps de migrer les scripts du NAS, l'ancien secret `X-Internal-Token` (`INTERNAL_API_TOKEN`)
  reste accepté et vaut tous les scopes ; chaque usage est journalisé (`API_KEY / LEGACY_USED`).
  Sans identifiant : `401`. Clé inconnue, révoquée ou expirée : `401 INVALID_API_KEY`. Clé sans
  ce scope : `403 INSUFFICIENT_SCOPE`.

  ## Réponse

  `200` avec un rapport par famille :

  ```json
  {
    "categories": { "created": 0, "updated": 0, "deleted": 0 },
    "priorities": { "created": 0, "updated": 0, "deleted": 0 },
    "types":      { "created": 0, "updated": 0, "deleted": 0 },
    "creatures":  { "created": 0, "updated": 0, "deleted": 0 },
    "techniques": { "created": 0, "updated": 0, "deleted": 0 },
    "traits":     { "created": 0, "updated": 0, "deleted": 0 },
    "links": { "techniqueTargets": 546, "learnings": 2517, "temtemTraits": 330, "typeMatchups": 144 }
  }
  ```

  Une synchronisation sans changement rend des compteurs à zéro : l'upsert ne réécrit pas une
  ligne identique. Les tables de liaison, elles, sont toujours réécrites en bloc — leur nombre
  de lignes est donc un total, pas un delta.

  ## Ce qui peut échouer

  - `503 TEMTEM_ASSET_UNAVAILABLE` / `TEMTEM_ASSET_INVALID` — un fichier est injoignable ou illisible.
  - `503 TEMTEM_ASSET_EMPTY` — un fichier est vide. La synchronisation s'arrête **avant** toute
    écriture : sans ce garde-fou, une extraction ratée viderait la table correspondante et
    emporterait le reste par cascade.

  Tout se joue dans une seule transaction : un échec en cours de route ne laisse rien à moitié
  écrit.
