info:
  name: Me
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiCoreUrl}}/users/me"
  auth:
    type: bearer
    token: "{{authToken}}"

docs: |-
  Profil de l'utilisateur connecté.

  `role` est un objet unique (ou null) et non une liste : un utilisateur ne détient qu'un
  rôle global. Chaque entrée de `modules` porte de même un `role` unique.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
