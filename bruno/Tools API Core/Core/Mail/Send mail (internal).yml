info:
  name: Send mail (internal)
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiUrl}}/internal/mail"
  headers:
    - name: X-Internal-Token
      value: "{{internalApiToken}}"
  auth: none
  body:
    type: json
    data: |-
      {
        "to": ["{{authEmail}}"],
        "subject": "Test API Core - route interne",
        "text": "Envoi de test depuis Bruno via la route de service à service."
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
