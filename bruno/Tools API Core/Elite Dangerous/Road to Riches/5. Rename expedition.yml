info:
  name: Rename expedition
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{apiUrl}}/elite-dangerous/expeditions/00000000-0000-0000-0000-000000000000/name"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Expédition renommée"
      }
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Renomme l'expédition. 204 sans corps.

  `name` est obligatoire (`[Required]`) : absent ou vide, ASP.NET rejette en 400 avant
  d'appeler l'action.

  Rôle minimum : USER.
