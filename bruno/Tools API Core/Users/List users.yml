info:
  name: List users
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}/users"
  auth:
    type: bearer
    token: "{{authToken}}"

docs: |-
  Tableau d'administration des utilisateurs.

  Rôle minimum : ADMIN. Attention, ADMIN est *au-dessus* de TECH dans la hiérarchie :
  un jeton TECH reçoit un 403 INSUFFICIENT_ROLE.

  `roleId` est l'identifiant du rôle global, à résoudre contre GET /roles. Nul si
  l'utilisateur n'a aucun rôle : un utilisateur n'en détient qu'un au plus.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
