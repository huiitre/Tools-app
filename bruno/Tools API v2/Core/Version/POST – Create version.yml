info:
  name: POST – Create version
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiJavaUrl}}core/version"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "version": "1.2.0",
        "module": "core",
        "description": "Ajout du changelog global",
        "createdAt": "2025-01-01T12:00:00"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
