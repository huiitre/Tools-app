info:
  name: Créer une clé
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiUrl}}/admin/api-keys"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Extracteur Temtem",
        "description": "Synchronisation du catalogue Temtem depuis le NAS.",
        "expiresAt": "2027-11-11T00:00:00Z",
        "scopes": ["temtem:sync", "core.notifications:publish"]
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const json = res.getBody();
        if (json && json.apiKey) {
          bru.setVar('apiKeyId', json.apiKey.id);
          bru.setVar('apiKeyValue', json.key);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  US-1. Rend `{ apiKey: ApiKeyView, key }`. **`key` est la clé en clair, montrée une seule fois** :
  la base n'en garde que le SHA-256 et les 12 premiers caractères (`keyPrefix`). Le script
  la range dans `apiKeyValue` et l'id dans `apiKeyId`. Rôle minimum : ADMIN.

  `expiresAt` est obligatoire, dans le futur et à 3 ans au plus de la création.

  - `400 API_KEY_NAME_REQUIRED` / `API_KEY_NAME_TOO_LONG` — nom absent ou au-delà de 100 caractères.
  - `400 API_KEY_DESCRIPTION_REQUIRED` / `API_KEY_DESCRIPTION_TOO_LONG` — description absente ou au-delà de 500.
  - `400 API_KEY_SCOPE_REQUIRED` — aucun scope.
  - `400 API_KEY_SCOPE_UNKNOWN` — un scope absent du catalogue.
  - `400 API_KEY_EXPIRATION_PAST` — expiration passée.
  - `400 API_KEY_EXPIRATION_TOO_FAR` — expiration au-delà de 3 ans.
  - `409 API_KEY_NAME_TAKEN` — une clé non révoquée porte déjà ce nom.
