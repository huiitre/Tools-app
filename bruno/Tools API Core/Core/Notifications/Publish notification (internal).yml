info:
  name: Publish notification (internal)
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiUrl}}/internal/notifications"
  headers:
    - name: X-Api-Key
      value: "{{apiKeyValue}}"
  body:
    type: json
    data: |-
      /* Un seul destinataire au choix parmi targetUserId / targetMinRole / targetModuleId est
         obligatoire (voir InternalNotificationsController.cs). type facultatif, défaut INFO
         (SUCCESS/WARNING/ERROR/INFO). Pas de targetUserIds (liste) sur cette route, contrairement
         à /internal/realtime/publish — un seul utilisateur précis à la fois ici.
      {
        "title": "...", "body": "...", "type": "INFO",
        "targetUserId": 1              // Un utilisateur précis
      }
      {
        "title": "...", "body": "...", "type": "INFO",
        "targetMinRole": "USER"        // Rôle mini (READ_ONLY/USER/MODERATOR/TECH/ADMIN/OWNER)
                                        // "USER" = tout le monde (rôle assigné à l'inscription)
      }
      {
        "title": "...", "body": "...", "type": "INFO",
        "targetModuleId": 5,           // Tous les membres d'un module
        "metadata": "{\"route\": \"home\"}" // JSON optionnel pour le front
      }
      */
      {
        "title": "Test API Core - route interne",
        "body": "Envoi de test depuis Bruno via la route de service à service.",
        "type": "INFO",
        // "targetUserId": 1,
        "targetMinRole": "READ_ONLY"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Ancienne URL des services, gardée le temps de leur migration : même use case que
  `POST /notifications`, réponse d'origine (`200` + `id`, `204` sans destinataire). Un seul
  destinataire au choix est obligatoire.

  Authentification : un utilisateur **TECH** (Bearer), ou une **clé d'API** portant `core.notifications:publish`
  dans `X-Api-Key` — la variable `apiKeyValue` est posée par « API Keys / 2. Créer une clé ». Le
  temps de migrer les scripts du NAS, l'ancien secret `X-Internal-Token` (`INTERNAL_API_TOKEN`)
  reste accepté et vaut tous les scopes ; chaque usage est journalisé (`API_KEY / LEGACY_USED`).
  Sans identifiant : `401`. Clé inconnue, révoquée ou expirée : `401 INVALID_API_KEY`. Clé sans
  ce scope : `403 INSUFFICIENT_SCOPE`.
