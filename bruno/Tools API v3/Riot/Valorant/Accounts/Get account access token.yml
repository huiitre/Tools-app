info:
  name: Get account access token
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiJavaUrl}}/riot/valorant/accounts/:accountId/refresh"
  params:
    - name: accountId
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Rafraîchit (si besoin) et retourne l'access token pour le compte Valorant lié donné.
