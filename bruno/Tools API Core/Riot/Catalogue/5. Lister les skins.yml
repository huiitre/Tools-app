info:
  name: Lister les skins
  type: http
  seq: 5

http:
  method: GET
  url: "{{apiUrl}}/riot/valorant/skins?accountId=1"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Tous les skins, avec leurs niveaux, leurs chromas et leur rareté.

  Rôle minimum : READ_ONLY.
