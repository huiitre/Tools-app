info:
  name: Skin par level id
  type: http
  seq: 8

http:
  method: GET
  url: "{{apiUrl}}/riot/valorant/skins/by-level/00000000-0000-0000-0000-000000000000?accountId=1"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **La route la plus utile de la boutique.** Le storefront Riot ne désigne les skins que par l'UUID
  de leur *niveau* (`EquippableSkinLevel`), jamais par celui du skin racine : c'est cette route qui
  fait le pont vers le catalogue local.

  Rôle minimum : READ_ONLY.
