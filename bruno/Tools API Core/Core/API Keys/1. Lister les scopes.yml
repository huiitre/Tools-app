info:
  name: Lister les scopes
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/admin/api-keys/scopes"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  US-4. Rend les codes du catalogue des scopes, triés (`["core.gameservers:sync", …]`).
  Le catalogue vit dans le code (`Domain/ApiKeyScope.cs`), jamais en base. Rôle minimum : ADMIN.
