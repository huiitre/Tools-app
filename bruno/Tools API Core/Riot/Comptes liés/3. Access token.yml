info:
  name: Access token
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/riot/valorant/accounts/1/refresh"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Échange le refresh token stocké contre un access token frais, et fait tourner le refresh token.

  Un jeton refusé par Riot **délie le compte** : la ligne est supprimée, il faut le relier.

  Rôle minimum : READ_ONLY.
