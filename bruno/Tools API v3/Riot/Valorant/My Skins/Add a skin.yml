info:
  name: Add a skin
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiJavaUrl}}/riot/valorant/my-skins"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "skinId": 1,
        "accountId": 1
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
