info:
  name: Valorant Store
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/riot/valorant/store"
  headers:
    - name: X-Riot-Token
      value: "{{riotAccessToken}}"
      description: "Optionnel : utilise le token en mémoire du front. Si absent, l'API utilise le refresh token en base."
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Récupère le shop quotidien, les bundles et le marché noir enrichis avec les données de la base Tools.
