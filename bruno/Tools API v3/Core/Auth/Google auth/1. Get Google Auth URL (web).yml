info:
  name: 1. Get Google Auth URL (web)
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiJavaUrl}}/auth/google/url?source=web"
  params:
    - name: source
      value: web
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
