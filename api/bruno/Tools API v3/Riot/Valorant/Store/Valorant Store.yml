info:
  name: Valorant Store
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/riot/valorant/store?accountId=1"
  headers:
    - name: X-Riot-Token
      value: "{{riotAccessToken}}"
      description: "Optionnel : si fourni, mode manuel (pas de compte lié requis). Sinon, accountId est obligatoire et utilise le refresh token stocké pour ce compte."
  params:
    - name: accountId
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Récupère le shop quotidien, les bundles et le marché noir enrichis avec les données de la base Tools.
