info:
  name: Lister mes todolists
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/todolists"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Les todolists de l'appelant, triées par `displayOrder` croissant.

  Champs : `id`, `name`, `active`, `favorite`, `colorHex`, `displayOrder`.
