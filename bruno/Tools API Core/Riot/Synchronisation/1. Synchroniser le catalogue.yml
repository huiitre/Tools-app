info:
  name: Synchroniser le catalogue
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiUrl}}/internal/riot/valorant/sync"
  headers:
    - name: X-Api-Key
      value: "{{apiKeyValue}}"
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Recharge tout le catalogue depuis les données de l'extracteur, lues en HTTP sur le CDN des assets.

  Ordre imposé, dans une seule transaction : raretés, armes, skins (qui s'y rattachent), packs.
  Niveaux et chromas sont purgés puis réinsérés. Rend un rapport créés/modifiés/supprimés par
  famille.

  Appelée par `update_valorant.sh` sur le NAS après une synchro des assets, et relançable à la
  main par un TECH (une synchro ratée ne se rejoue pas toute seule).

  Authentification : un utilisateur **TECH** (Bearer), ou une **clé d'API** portant `riot.valorant:sync`
  dans `X-Api-Key` — la variable `apiKeyValue` est posée par « API Keys / 2. Créer une clé ». Le
  temps de migrer les scripts du NAS, l'ancien secret `X-Internal-Token` (`INTERNAL_API_TOKEN`)
  reste accepté et vaut tous les scopes ; chaque usage est journalisé (`API_KEY / LEGACY_USED`).
  Sans identifiant : `401`. Clé inconnue, révoquée ou expirée : `401 INVALID_API_KEY`. Clé sans
  ce scope : `403 INSUFFICIENT_SCOPE`.
