info:
  name: Synchroniser le catalogue
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiUrl}}/internal/riot/valorant/sync"
  headers:
    - name: X-Internal-Token
      value: "{{internalApiToken}}"
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Recharge tout le catalogue depuis les données de l'extracteur, lues en HTTP sur le CDN des assets.

  Ordre imposé, dans une seule transaction : raretés, armes, skins (qui s'y rattachent), packs.
  Niveaux et chromas sont purgés puis réinsérés. Rend un rapport créés/modifiés/supprimés par
  famille.

  **Route de service à service**, appelée par `update_valorant.sh` sur le NAS après une synchro
  des assets. L'authentification se fait par le secret partagé `X-Internal-Token`
  (`INTERNAL_API_TOKEN`), jamais par jeton utilisateur.

  Sans le secret, ou avec une valeur fausse : **404**, jamais 401 — la route ne confirme pas son
  existence.
