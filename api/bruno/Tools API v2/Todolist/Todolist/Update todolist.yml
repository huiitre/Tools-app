info:
  name: Update todolist
  type: http
  seq: 4

http:
  method: PUT
  url: "{{apiUrl}}todolist/{{idtodolist}}/update"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{\r

      \  \"columns\": [\r

      \    { \"name\": \"qsdqdqsdsqd\" },\r

      \    { \"is_favorite\": true },\r

      \    { \"color\": \"#FF5733\" }\r

      \  ]\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
