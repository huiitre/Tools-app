info:
  name: Refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiUrl}}/auth/refresh"

runtime:
  scripts:
    - type: after-response
      code: |-
        const json = res.getBody();
        bru.setGlobalEnvVar('authToken', json.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
