info:
  name: Update progress
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{apiUrl}}/elite-dangerous/r2r/expeditions/{{expedition_id}}/progress"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "currentSystemIndex": 3,
        "currentBodiesDone": [123456789, 987654321]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
