info:
  name: Retirer un skin
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{apiUrl}}/riot/valorant/my-skins/1?accountId=1"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  204 sans corps. Retirer un skin qui n'était pas marqué n'est pas une erreur : le résultat voulu
  est déjà obtenu.

  Rôle minimum : USER.
