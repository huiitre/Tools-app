info:
  name: 1. List modules
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/modules"
  auth:
    type: bearer
    token: "{{authToken}}"

docs: |-
  Catalogue des modules fonctionnels (Dofus, Palworld…).

  Rôle minimum : ADMIN — comme toutes les routes de ce dossier, y compris la gestion du
  catalogue, malgré le `@RequiredRole(TECH)` décoratif de l'API Java.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
