spring.application.name=tools-api-dev

# ===============================
# Database
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tools_dev}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8083}
server.servlet.context-path=/api/v3

# ===============================
# Logging (DEV = utile)
# ===============================
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.fr.huiitre.tools=DEBUG
logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.coyote=WARN
spring.main.log-startup-info=false

# temporaire
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# Dev tools
# ===============================
spring.devtools.restart.enabled=true

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=none

# ===============================
# Internal services
# ===============================
tools.services.host=http://localhost:3002
tools.core.base-url=http://localhost:5090
tools.core.internal-token=${INTERNAL_API_TOKEN}

# ===============================
# JWT
# ===============================
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl=600
security.jwt.refresh-token-ttl=604800
security.jwt.issuer=tools-api
security.cookie.secure=false

# ===============================
# SPRINGDOC API
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# Security CSP
# ===============================
security.csp.policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:

# ===============================
# SMTP
# ===============================
spring.mail.host=ssl0.ovh.net
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_USERNAME}
mail.to=${MAIL_TO}
report.dir=${REPORT_DIR:./tmp/reports}

# ===============================
# PATH
# ===============================
tools.assets.base-path=/data/docker/tools/tools_assets
palworld.server-data.path=/data/docker/tools/tools_palworld_server_data_extractor/data/json

# ===============================
# URLs
# ===============================
app.frontend.base-url=http://localhost:5173
app.assets.base-url=https://assets.tools.huiitre.fr

# ===============================
# Google OAuth
# ===============================
google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
google.oauth.redirect-uri=http://localhost:8083/api/v3/auth/callback/google

# ===============================
# Encryption
# ===============================
tools.security.encryption.master-key=${TOOLS_ENCRYPTION_KEY}

# ===============================
# HikariCP
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000