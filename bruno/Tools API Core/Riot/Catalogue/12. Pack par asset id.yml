info:
  name: Pack par asset id
  type: http
  seq: 12

http:
  method: GET
  url: "{{apiUrl}}/riot/valorant/bundles/by-asset/00000000-0000-0000-0000-000000000000"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Recherche par l'UUID Riot du pack, celui que renvoie le storefront.

  Rôle minimum : READ_ONLY.
