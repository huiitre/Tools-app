info:
  name: 1. Stream Notifications (SSE)
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/notifications/stream"
  headers:
    - name: Accept
      value: text/event-stream
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Ouvre la connexion temps réel. Garder cet onglet ouvert pour voir les notifs tomber.
