server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Inclusion indispensable des types MIME
    include /etc/nginx/mime.types;

    # Assets : On renvoie 404 si manquant au lieu de index.html (évite l'erreur MIME type)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : Fallback sur index.html pour les routes applicatives
    location / {
        # Pas de cache pour l'index pour garantir la détection des nouvelles versions
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        try_files $uri $uri/ /index.html;
    }
}