info:
  name: Get game server details
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/gameservers/{{gameCode}}/details"
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  variables:
    - name: gameCode
      value: ark-survival-ascended

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Volet stable du dashboard d'un serveur, chargé une fois à l'ouverture. Un JWT avec au moins le rôle READ_ONLY est requis. serverName, gameName et pictureUrl viennent de game_servers et sont toujours renseignés ; version, description et worldId ne le sont que si le jeu sait les fournir (null pour Ark, renseignés pour Palworld). 404 GAME_SERVER_NOT_FOUND si le slug est inconnu ou masqué, 404 GAME_SERVER_DASHBOARD_UNSUPPORTED si aucun provider n'est enregistré pour le jeu.
