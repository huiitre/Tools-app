info:
  name: Sync game servers (internal)
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiUrl}}/internal/gameservers/sync"
  headers:
    - name: X-Api-Key
      value: "{{apiKeyValue}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: >-
  Déclenche le sync : l'API lit elle-même le fichier consolidé
  https://assets.tools.huiitre.fr/tools_core/gameservers/gameservers.json produit par l'extractor.
  Cette route n'accepte aucun body. TECH, ou clé d'API core.gameservers:sync dans X-Api-Key
  (variable apiKeyValue) ; l'ancien X-Internal-Token reste accepté le temps de la migration.
  Une réponse 200 retourne created, updated, unchanged et deleted.
  Les mods et le modpack de chaque serveur y sont enregistrés : une liste de mods modifiée
  compte comme une mise à jour. Les icônes des nouveaux mods sont demandées à leur hébergeur
  (Modrinth, CurseForge si la clé est configurée) une seule fois ; une panne les laisse vides
  sans faire échouer le sync. 400 INVALID_MODPACK_FILE si modpackFile sort du dossier
  modpacks/, 400 INVALID_GAME_SERVER_MOD si un mod n'a pas de nom, 400 INVALID_GAME_SERVER_INFO
  si une info du manifest n'a pas de label ou de value. Les infos sont stockées telles
  quelles ; une info modifiée compte comme une mise à jour.
