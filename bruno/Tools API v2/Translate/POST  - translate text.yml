http:
  method: POST
  url: "{{apiJavaUrl}}translate"
  body:
    type: json
    data: "{\r

      \  \"sourceLang\": \"fr\",\r

      \  \"targetLang\": \"en\",\r

      \  \"text\": \"je t'aime ma petite pute\"\r

      }\r\n"
