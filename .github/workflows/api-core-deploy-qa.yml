name: Deploy API Core QA

on:
  push:
    branches:
      - qa
    paths:
      - 'api-core/**'
      - '.github/workflows/api-core-deploy-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-core-qa-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculate application version from API Core commits
        id: version
        run: |
          set -euo pipefail

          git_sha="${GITHUB_SHA::7}"
          version="0.0.0"
          breaking_pattern='^[[:alnum:]_-]+(\([^)]*\))?!:'
          feature_pattern='^feat(\([^)]*\))?:'
          fix_pattern='^fix(\([^)]*\))?:'

          while IFS= read -r commit; do
            subject="$(git log --format=%s -n 1 "$commit")"
            message="$(git log --format=%B -n 1 "$commit")"
            major="${version%%.*}"
            remainder="${version#*.}"
            minor="${remainder%%.*}"
            patch="${remainder#*.}"

            if [[ "$subject" =~ $breaking_pattern ]] || grep --quiet '^BREAKING CHANGE:' <<< "$message"; then
              version="$((major + 1)).0.0"
            elif [[ "$subject" =~ $feature_pattern ]]; then
              version="$major.$((minor + 1)).0"
            elif [[ "$subject" =~ $fix_pattern ]]; then
              version="$major.$minor.$((patch + 1))"
            fi
          done < <(git log --reverse --format=%H "$GITHUB_SHA" -- api-core)

          echo "Calculated API Core version: $version."

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "git_sha=$git_sha" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./api-core
          file: ./api-core/Dockerfile
          push: true
          build-args: |
            APPLICATION_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.git_sha }}
          tags: |
            huiitre/tools_api_core:qa
            huiitre/tools_api_core:sha-${{ steps.version.outputs.git_sha }}
