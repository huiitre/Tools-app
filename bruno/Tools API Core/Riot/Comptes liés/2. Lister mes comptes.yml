info:
  name: Lister mes comptes
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}/riot/valorant/accounts"
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Comptes Valorant liés à l'utilisateur courant. Le refresh token n'est jamais renvoyé.

  Rôle minimum : READ_ONLY.
