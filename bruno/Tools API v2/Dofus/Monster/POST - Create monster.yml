info:
  name: POST - Create monster
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiJavaUrl}}dofus/monster"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Larve Bleue",
        "code": "larve_bleue",
        "isBoss": false,
        "isMiniboss": false,
        "isQuestMonster": false,
        "img": "https://api.dofusdb.fr/img/monsters/1.png",
        "favoriteSubareaId": 173
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
