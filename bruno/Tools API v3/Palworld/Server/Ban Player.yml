info:
  name: Ban Player
  type: http
  seq: 8

http:
  method: POST
  url: "{{apiUrl}}/palworld/server/ban"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userId": "steam_xxx",
        "message": "Banned by admin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
