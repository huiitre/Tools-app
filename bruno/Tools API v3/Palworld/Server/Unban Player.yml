info:
  name: Unban Player
  type: http
  seq: 9

http:
  method: POST
  url: "{{apiJavaUrl}}/palworld/server/unban"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userId": "steam_xxx"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
