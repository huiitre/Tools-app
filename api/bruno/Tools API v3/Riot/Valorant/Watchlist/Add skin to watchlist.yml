info:
  name: Add skin to watchlist
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiUrl}}/riot/valorant/watchlist"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "skinId": 1
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
