info:
  name: List
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/vpn/peers"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Liste les peers WireGuard (nom, IP, clé publique, état du handshake, compteurs, diagnostic).

  Rôle ADMIN requis.

  La source dépend de l'environnement : en dev et en QA un jeu de données en dur couvrant tous
  les cas d'affichage, ailleurs le service wg_api du NAS (WG_API_HOST / WG_API_TOKEN). Le service
  injoignable remonte en 503, jamais en liste vide.
